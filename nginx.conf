worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    client_max_body_size 50M;
    # Extract Real IP from Cloudflare, fallback to remote_addr if direct
    map $http_cf_connecting_ip $real_client_ip {
        default $http_cf_connecting_ip;
        ""      $binary_remote_addr;
    }
    
    # Rate limiting zone (20 requests per second per IP)
    limit_req_zone $real_client_ip zone=api_limit:10m rate=20r/s;
    server {
        listen 80;

        # Security Headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Handle direct /v1/ requests from frontend bypassing /api/ prefix
        location /v1/ {
            limit_req zone=api_limit burst=100 nodelay;
            rewrite ^/v1/(.*) /v1/$1 break;
            proxy_pass http://api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Serve static uploads
        location /uploads/ {
            alias /app/uploads/;
            expires max;
            add_header Cache-Control public;
        }
    }
}
